<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>شكرًا لتواصلكم معنا</title>
  <style>
    :root {
      --bg:#f7f4ee;
      --card:#ffffff;
      --text:#1d2430;
      --muted:#6f7680;
      --accent:#243b53;
      --green:#25D366;
      --shadow:0 22px 60px rgba(35,45,55,.10);
    }
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      padding:24px;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
      background:
        radial-gradient(circle at top right, rgba(215,199,170,.34), transparent 35%),
        var(--bg);
      color:var(--text);
    }
    .card{
      width:min(620px,100%);
      background:rgba(255,255,255,.95);
      border-radius:28px;
      padding:44px 34px;
      text-align:center;
      box-shadow:var(--shadow);
    }
    .check{
      width:68px;height:68px;border-radius:50%;
      display:grid;place-items:center;
      margin:0 auto 22px;
      background:#eef7f0;
      font-size:32px;
    }
    h1{font-size:clamp(30px,6vw,48px);margin:0 0 14px;line-height:1.2}
    p{font-size:18px;line-height:1.8;color:var(--muted);margin:0 auto 26px;max-width:500px}
    .wa{
      display:block;
      width:100%;
      text-decoration:none;
      background:var(--green);
      color:white;
      padding:16px 20px;
      border-radius:14px;
      font-weight:700;
      font-size:17px;
      margin-top:10px;
    }
    .back{
      display:inline-block;
      margin-top:18px;
      color:var(--accent);
      text-decoration:none;
      font-size:14px;
    }
    .small{font-size:13px;color:#979b9f;margin-top:18px}
  </style>
</head>
<body>
  <main class="card">
    <div class="check">✓</div>
    <h1>شكرًا لتواصلكم معنا</h1>
    <p>
      تم استلام التفاصيل بنجاح.<br>
      سنتواصل معكم قريبًا لمعرفة احتياجات الطالب وتنسيق الدرس المناسب.
    </p>

    <a class="wa" href="https://wa.me/972533090047?text=%D9%85%D8%B1%D8%AD%D8%A8%D8%A7%D8%8C%20%D8%A3%D8%B1%D8%B3%D9%84%D8%AA%20%D8%AA%D9%81%D8%A7%D8%B5%D9%8A%D9%84%20%D8%A8%D8%AE%D8%B5%D9%88%D8%B5%20%D8%AF%D8%B1%D9%88%D8%B3%20%D8%A7%D9%84%D9%84%D8%BA%D8%A9%20%D8%A7%D9%84%D8%B9%D8%A8%D8%B1%D9%8A%D8%A9%20%D9%88%D8%A3%D8%B1%D8%BA%D8%A8%20%D8%A8%D8%A7%D9%84%D8%AA%D9%88%D8%A7%D8%B5%D9%84." target="_blank" rel="noopener noreferrer">
      تواصلوا معنا عبر واتساب
    </a>

    <a class="back" href="index.html">العودة إلى الصفحة الرئيسية</a>
    <div class="small">يمكنكم أيضًا انتظار اتصالنا وسنتواصل معكم في أقرب وقت.</div>
  </main>
</body>
</html>
